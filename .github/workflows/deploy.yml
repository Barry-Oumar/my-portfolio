# Nom du workflow qui apparaîtra dans l'onglet "Actions" de GitHub
name: Build and Deploy to GitHub Pages

# Déclencheur : ce workflow s'exécute à chaque fois que vous "poussez"
# du code sur la branche 'main'
on:
  push:
    branches:
      - main

# Permissions : Donne au workflow le droit d'écrire sur votre dépôt
# pour publier le site.
permissions:
  contents: write

jobs:
  # Un seul "job" (tâche) qui s'appelle build-and-deploy
  build-and-deploy:
    # Le type de machine virtuelle à utiliser (Ubuntu est le standard)
    runs-on: ubuntu-latest
    
    # Les étapes du job
    steps:
      # Étape 1 : Récupère votre code depuis la branche 'main'
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # Étape 2 : Installe Python sur la machine virtuelle
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Assurez-vous que cette version correspond à la vôtre

      # Étape 3 : Installe les dépendances de votre projet
      - name: Install dependencies 📦
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Étape 4 : Exécute votre script freeze.py pour générer le site statique
      # Le site sera créé dans un dossier 'build' sur la machine virtuelle
      - name: Build static site 🏗️
        run: python freeze.py

      # Étape 5 : Déploie le contenu du dossier 'build' sur la branche 'gh-pages'
      # C'est cette branche spéciale que GitHub Pages utilise pour héberger le site.
      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # La branche de destination
          folder: build   # Le dossier source à déployer