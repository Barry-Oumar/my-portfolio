<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>{% block title %}{% endblock %} | {{ me.name }}</title>
    <meta name="description" content="Portfolio de {{ me.name }}, {{ me.headline }}. Découvrez mes projets en simulation, modélisation et développement web.">
    <meta name="author" content="{{ me.name }}">
    <meta property="og:title" content="Portfolio | {{ me.name }}">
    <meta property="og:description" content="{{ me.headline }}">
    <meta property="og:image" content="{{ url_for('static', filename='images/og_image.png') }}">
    <meta property="og:url" content="{{ config.FREEZER_BASE_URL }}">
    <meta property="og:type" content="website">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm sticky-top">
            <div class="container">
                <a class="navbar-brand" href="{{ url_for('index') }}">{{ me.name }}</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav">
                    <span class="navbar-toggler-icon"></span> 
                </button>
                <div class="collapse navbar-collapse" id="main-nav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Accueil</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('projects') }}">Projets</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('resume') }}">Parcours</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('contact') }}">Contact</a></li>
                    </ul>
                    <a href="{{ url_for('static', filename=me.cv_file) }}" class="btn btn-primary ms-lg-3" download>Télécharger mon CV</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        {% block main %}{% endblock %}
    </main>

    <footer class="text-center py-4 mt-auto bg-light">
        <div class="container">
            <p class="mb-2">© 2025 {{ me.name }}. Tous droits réservés.</p>
            <div>
                <a href="https://www.linkedin.com/in/oumar-barry-0876a12a3" class="text-dark mx-2" target="_blank" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
                <a href="https://github.com/oumarbarry" class="text-dark mx-2" target="_blank" aria-label="GitHub"><i class="bi bi-github"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/animations.js') }}"></script>
</body>
</html>
