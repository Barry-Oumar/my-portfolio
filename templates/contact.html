{% extends "layout.html" %}
{% block title %}Contact{% endblock %}
{% block main %}
<div class="container mt-5">
    <h2 class="mb-4 text-center">Contact Me</h2>
    <form method="post" class="mx-auto" style="max-width: 500px;">
        <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" class="form-control" id="name" name="name" required maxlength="100" placeholder="Enter your name">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Your Email</label>
            <input type="email" class="form-control" id="email" name="email" required maxlength="100" placeholder="Enter your email">
        </div>
        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" name="message" rows="5" required placeholder="Type your message here"></textarea>
        </div>
        <div class="mb-3 text-center">
            <button type="submit" class="btn btn-success w-100">
                <i class="bi bi-envelope-fill"></i> Send Message
            </button>
        </div>
    </form>
    <div class="mt-4 text-center">
        <p class="mb-1"><i class="bi bi-envelope"></i> Email: <a href="mailto:oumarbarry@gmail.com">oumarbarry@gmail.com</a></p>
        <p>
            <a href="https://github.com/oumarbarry" class="text-dark me-2" target="_blank" aria-label="GitHub">
                <i class="bi bi-github"></i>
            </a>
            <a href="https://www.linkedin.com/in/oumar-barry-0876a12a3" class="text-dark mx-2" target="_blank" aria-label="LinkedIn">
                <i class="bi bi-linkedin"></i>
            </a>
            <a href="https://facebook.com/" class="text-dark mx-2" target="_blank" aria-label="Facebook">
                <i class="bi bi-facebook"></i>
            </a>
            <a href="https://instagram.com/" class="text-dark ms-2" target="_blank" aria-label="Instagram">
                <i class="bi bi-instagram"></i>
            </a>
        </p>
    </div>
</div>
{% endblock %}
