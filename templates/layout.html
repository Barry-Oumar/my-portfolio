<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>{% block title %}{% endblock %} | {{ me.name }} - {{ me.title }}</title>
    <meta name="description"
        content="Portfolio de {{ me.name }}, {{ me.title }}. Expert en simulation de procédés, modélisation CFD et développement Python. Découvrez mes projets innovants.">
    <meta name="author" content="{{ me.name }}">
    <meta name="keywords" content="Ingénieur Chimique, Simulation, CFD, Python, Portfolio, {{ me.name }}">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:title" content="Portfolio | {{ me.name }} - {{ me.title }}">
    <meta property="og:description" content="{{ me.tagline }}">
    <meta property="og:image" content="{{ url_for('static', filename='images/og_image.png', _external=True) }}">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ request.url }}">
    <meta property="twitter:title" content="Portfolio | {{ me.name }} - {{ me.title }}">
    <meta property="twitter:description" content="{{ me.tagline }}">
    <meta property="twitter:image" content="{{ url_for('static', filename='images/og_image.png', _external=True) }}">

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>

<body>

    <!-- Navigation -->
    {% include 'partials/navbar.html' %}

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include 'partials/footer.html' %}

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
